<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <title>Desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="navbar">
      <div class="navbar-left">Grok Bot</div>
      <span class="paper-badge" id="paper-badge">PAPER</span>
      <span class="conn-status" id="conn-status" hidden>Offline</span>
    </header>
    <main id="home" class="screen">
      <div class="balance" id="balance">—</div>
      <p class="empty" id="empty-msg">Waiting for the first trade</p>
    </main>
    <nav class="tabbar" aria-label="Main">
      <button type="button" data-tab="home" class="active">Home</button>
      <button type="button" data-tab="agents">Agents</button>
      <button type="button" data-tab="activity">Activity</button>
      <button type="button" data-tab="account">Account</button>
    </nav>
  </div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
